    <!-- iOS ignores the manifest's background_color for the launch splash
         screen — without these, "Add to Home Screen" users see a blank
         white flash before the app loads. Covers current-generation
         iPhone/iPad portrait sizes; an unmatched older device just falls
         back to the same blank flash as today, not a broken state. -->
    <link rel="apple-touch-startup-image" href="/splash-se.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
